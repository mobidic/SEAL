FLASK:
  ENV: 'development' # choice : 'development', 'stage', 'production'
  SECRET_KEY: 'your_secret_key' # create your app secret key
  SQLALCHEMY_DATABASE_URI: 'postgresql:///seal' # you can edit the database configuration
  SQLALCHEMY_TRACK_MODIFICATIONS: true
  SCHEDULER_API_ENABLED: true
  SCHEDULER_TIMEZONE: 'Europe/Paris'
  SCHEDULER_JOB_DEFAULTS:
    coalesce: false
    max_instances: 1
  MAINTENANCE: false # Set to true or false
  FLASK_ADMIN_SWATCH: 'darkly'
  SESSION_COOKIE_NAME: "seal38"
GENOME: "grch38" # choices : "grch37", "grch38"
BP:
  name_bp:
    folder: "/path/to/analysis/folder"
    path: "/path/to/analysis/folder"
IGV_PATH: 
  fastaURL: "/path/to/igv/folder/hg38.fa"
  indexURL: "/path/to/igv/folder/hg38.fa.fai"
  twoBitURL: "/path/to/igv/folder/hg38.2bit"
  cytobandURL: "/path/to/igv/folder/cytoBandIdeo.txt.gz"
  aliasURL: "/path/to/igv/folder/hg38_alias.tab"
  chromSizesURL: "/path/to/igv/folder/hg38.chrom.sizes"
  maneBbURL: "/path/to/igv/folder/mane.1.0.bb"
  maneTrixURL: "/path/to/igv/folder/mane.1.0.ix"
  rsdbURL: "/path/to/igv/folder/refSeqHistorical.bb"
  refseq: "/path/to/igv/folder/ncbiRefSeq.txt.gz"